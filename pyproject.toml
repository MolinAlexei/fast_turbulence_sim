[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast_turbulence_sim"
version = "0.1.0"
description = "Fast and furious turbulence simulator"
authors = [{ name = "Alexei Molin", email = "alexei.molin@utoulouse.fr" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "jax",
    "astropy",
    "pandas",
    "torch"
]

[tool.setuptools.packages.find]
where = ["src"]